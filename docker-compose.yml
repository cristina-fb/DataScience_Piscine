services:
    postgres:
        build: ./postgres
        container_name: postgres
        env_file:
        - .env
        ports:
        - "5432:5432"
        volumes:
        - .:/home/
        networks:
        - mydb

    pgadmin:
        image: dpage/pgadmin4:9.2.0
        container_name: pgadmin
        env_file:
        - .env
        ports:
        - "8080:8080"
        depends_on:
        - postgres
        networks:
        - mydb

networks:
  mydb:
   driver: bridge