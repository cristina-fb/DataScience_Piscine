services:
    postgres:
        build: ./postgres
        container_name: postgres
        env_file:
        - .env
        ports:
        - "5432:5432"
        volumes:
        - ./data:/home/data
        - ./ex02:/home/ex02
        - ./ex03:/home/ex03
        - ./ex04:/home/ex04
        networks:
        - mydb

    pgadmin:
        image: dpage/pgadmin4:9.2.0
        container_name: pgadmin
        env_file:
        - .env
        ports:
        - "5050:5050"
        depends_on:
        - postgres
        networks:
        - mydb

networks:
  mydb:
   driver: bridge